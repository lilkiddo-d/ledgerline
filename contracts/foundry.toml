[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../app/src/generated" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110

[lint]
lint_on_build = false

